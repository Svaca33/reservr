name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build-and-unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"
            - run: dotnet restore
            - run: dotnet build --no-restore
            - run: dotnet test tests/Reservr.Domain.Tests --no-build
            - run: dotnet test tests/Reservr.ArchitectureTests --no-build

    integration:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"
            - run: dotnet restore
            - run: dotnet build --no-restore
            - run: dotnet test tests/Reservr.IntegrationTests --no-build
